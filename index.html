<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glyph Generator</title>
    <link rel="stylesheet" href="./styles.css">
   
</head>

<body style="background-color: rgb(142, 3, 158);">
<section class = 'Panel' id="LPanel">
    <canvas id="glyph" width="1000px" height=1000px style="position: absolute; left: 20%; top:100px;"></canvas>
    <p>Glyph Settings</p>
    <form id = glyphSettings>
    <label for = "glyphText">Glyph text:</label>
    <input id="glyphText" name = "glyphText" type = "text" placeholder ="Your text here" maxlength="28" >
        <label id = glyphTextLengthCheck for = "glyphText">Length: 0</label>
    <div class = "glyphForm"></div>

    <p>Glyph Text Length</p>
    <input type="radio" value=14 name ='glyphLength' id="AllUnicode">
    <label for="AllUnicode">14 (All unicode)</label>
    <input type="radio" value=9 name ='glyphLength' id="mostUnicode">
    <label for="mostUnicode">9 (Most Unicode)</label>
    <input type="radio" value=7 name ='glyphLength' id="looksGood" checked>
    <label for="looksGood">7 (Looks Best)</label>
    <input type="radio" value= 4 name ='glyphLength' id="ASCII">
    <label for="ASCII">4 (All ASCII)</label>
    <input type="radio" value= -1 name ='glyphLength' id="Custom">
    <label for="Custom">Custom</label>
    <div class = "glyphForm"></div>
    <section id="customLengthSettings" style = "display: none">
            <input type="number" name = 'glyphLengthCustom' id="customNumber" min="1" value=7>
             <label for="customNumber">Choose your length</label>
             <div class = "glyphForm"></div>
             <input type = "checkbox" id="primeCheck" switch checked>
             <label for="primeCheck">Force prime numbers?</label>
        </section>

    <p>Glyph Color</p>

    <input type="radio" value=0 name ='Color' id="Rainbow" checked >
    <label for="Rainbow">Rainbow</label>
    <input type="radio" value=1 name ='Color'id = "Choose">
    <label for="Choose">Choose your Color</label>
    <div class = "glyphForm"></div>
    <section id = 'rainbowShifter'>
    <input type = 'range' min=0 max = 359 value = 270 name = "Rainbow offset" id = "rainbowOffset">
    <label for = 'rainbowOffset'>Shift rainbow color</label>
    </section>
    <section id = 'customColorPicker' style = "display: none;">
    <input type="color" id="customColor" name="glyphColor" value="#000000" colorspace="limited-srgb"/>
    <label for = 'customColor'>Choose your color</label>

    <p>Background Color</p>
    </section>

    </form>

</section>
<section class = 'Panel' id="CPanel"></section>

<section class = 'Panel' id="RPanel"></section>

<script src="generator.js" ></script>
<script src="app.js" ></script>


</body>
